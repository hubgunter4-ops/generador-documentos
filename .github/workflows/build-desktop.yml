name: Build desktop installers

on:
  push:
    branches: [main]
    paths:
      - "desktop/combina-word/**"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    paths:
      - "desktop/combina-word/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Desktop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/combina-word
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/combina-word/requirements.txt
      - name: Install Tkinter runtime
        run: sudo apt-get update && sudo apt-get install -y python3-tk
        working-directory: .
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  linux-deb:
    name: Linux DEB
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/combina-word
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk dpkg-dev
        working-directory: .
      - name: Build DEB
        run: VERSION=1.0.0 ./packaging/build-deb.sh
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: combina-word-deb
          path: desktop/combina-word/dist/*.deb
          if-no-files-found: error

  windows-exe:
    name: Windows EXE
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/combina-word
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build EXE
        shell: pwsh
        run: .\packaging\build-windows.ps1
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: combina-word-exe
          path: desktop/combina-word/dist/CombinaWord.exe
          if-no-files-found: error
