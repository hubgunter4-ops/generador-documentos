name: Build Combina Word

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --clean --noconfirm combina-word.spec
      - uses: actions/upload-artifact@v4
        with:
          name: CombinaWord-windows
          path: dist/CombinaWord.exe
          if-no-files-found: error
          retention-days: 14

  deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev python3-tk python3-venv
      - run: chmod +x packaging/build-deb.sh && packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: combina-word-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
